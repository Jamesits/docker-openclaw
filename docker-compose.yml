services:
  openclaw-gateway:
    build: .
    # use docker.io/jamesits/openclaw:edge for testing images
    image: docker.io/jamesits/openclaw:latest
    networks:
      - openclaw
    environment:
      HOME: /home/node
      TERM: xterm-256color
    env_file:
      - .env
    volumes:
      - ./deployment/home:/home/node
    ports:
      - "[::1]:18789:18789"
      - "[::1]:18790:18790"
    init: true
    restart: unless-stopped
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--allow-unconfigured",
      ]

  chromium:
    image: docker.io/chromedp/headless-shell:stable
    restart: unless-stopped
    networks:
      - openclaw
    shm_size: "2gb"

networks:
  openclaw: {}
