services:
  openclaw-gateway:
    build: .
    image: docker.io/jamesits/openclaw:edge
    environment:
      HOME: /home/node
      TERM: xterm-256color
    env_file:
      - .env
    volumes:
      - ./deployment/home:/home/node
    ports:
      - "[::1]:18789:18789"
      - "[::1]:18790:18790"
    init: true
    restart: unless-stopped
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
      ]
