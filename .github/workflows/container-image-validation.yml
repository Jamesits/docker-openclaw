name: "Container Image Validation"

permissions:
  contents: read

on:
  pull_request:
    branches:
      - trunk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: audit

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: openclaw:ci-smoke
          cache-from: type=registry,ref=docker.io/jamesits/openclaw:github-actions-cache

      - name: Smoke test container image
        run: ./scripts/container-smoke-test.sh openclaw:ci-smoke
