name: "Container Image Validation"

permissions:
  contents: read

on:
  pull_request:
    branches:
      - trunk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            registry-1.docker.io:443
            production.cloudflare.docker.com:443
            auth.docker.io:443
            pkg-containers.githubusercontent.com:443
            ghcr.io:443
            _http._tcp.deb.debian.org:443
            deb.debian.org:443
            deb.debian.org:80
            debian.map.fastlydns.net:443
            debian.map.fastlydns.net:80
            raw.githubusercontent.com:443
            github.com:443
            formulae.brew.sh:443
            registry.npmjs.org:443

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: openclaw:ci-smoke
          cache-from: type=registry,ref=docker.io/jamesits/openclaw:github-actions-cache

      - name: Smoke test container image
        run: ./scripts/container-smoke-test.sh openclaw:ci-smoke
