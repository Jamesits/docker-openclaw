name: "Container Image Publish"

permissions:
  contents: read

on:
  push:
    branches:
      - trunk
    tags:
      - v*

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >
            registry-1.docker.io:443
            production.cloudflare.docker.com:443
            auth.docker.io:443
            pkg-containers.githubusercontent.com:443
            ghcr.io:443
            _http._tcp.deb.debian.org:443
            deb.debian.org:443
            deb.debian.org:80
            debian.map.fastlydns.net:443
            debian.map.fastlydns.net:80
            raw.githubusercontent.com:443
            github.com:443
            formulae.brew.sh:443

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: metadata
        with:
          images: docker.io/jamesits/openclaw
          tags: |
            type=edge,branch=trunk
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=registry,ref=docker.io/jamesits/openclaw:github-actions-cache
          cache-to: type=registry,ref=docker.io/jamesits/openclaw:github-actions-cache,mode=max,compression=zstd
