name: "Container Image Publish"

on:
  push:
    branches:
      - trunk
    tags:
      - v*

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: metadata
        with:
          images: docker.io/jamesits/openclaw
          tags: |
            type=edge,branch=trunk
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=registry,ref=docker.io/jamesits/openclaw:github-actions-cache
          cache-to: type=registry,ref=docker.io/jamesits/openclaw:github-actions-cache,mode=max,compression=zstd
